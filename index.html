<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
<link
  rel="stylesheet"

<style>
  /* Layout: one full-bleed WebGL house; quiet UI floats over it (top title, lower-third caption, bottom control bar). Single deliberate dusk look. */
  :root {
    --night: #15121a;
    --ivory: #f6f0e6;
    --muted: #bdb2a6;
    --brass: #d6a865;
    --glass: rgba(24, 20, 26, 0.72);
    --line: rgba(246, 240, 230, 0.16);
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html,
  body {
    height: 100%;
    margin: 0;
    background: var(--night);
    color: var(--ivory);
    overflow: hidden;
    overscroll-behavior: none;
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  canvas#gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  canvas#gl:active {
    cursor: grabbing;
  }
  button,
  label.btn {
    font: 500 14px/1 var(--body);
    letter-spacing: 0.02em;
    color: var(--ivory);
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 0 16px;
    min-height: 44px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    touch-action: manipulation;
  }
  button:focus-visible,
  label.btn:focus-within {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }
  #top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
    background: linear-gradient(rgba(14, 11, 16, 0.5), rgba(14, 11, 16, 0));
  }
  #top[hidden],
  #bar[hidden] {
    display: none;
  }
  #endMessage {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(145px + env(safe-area-inset-bottom, 0px));
    display: grid;
    justify-items: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(14px) scale(0.97);
    transition:
      opacity 1.1s ease,
      transform 1.1s cubic-bezier(0.2, 0.75, 0.25, 1);
    z-index: 2;
  }
  #endMessage.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  #endMessage span {
    padding: 10px 22px 12px;
    border: 1px solid rgba(214, 168, 101, 0.38);
    border-radius: 999px;
    background: rgba(24, 20, 26, 0.68);
    box-shadow:
      0 0 28px rgba(214, 168, 101, 0.18),
      0 8px 30px rgba(0, 0, 0, 0.24);
    backdrop-filter: blur(12px);
    color: var(--ivory);
    font: italic 600 clamp(22px, 5vw, 34px)/1.1 var(--display);
    text-align: center;
    text-shadow: 0 0 22px rgba(214, 168, 101, 0.36);
    animation: endMessageGlow 3.8s ease-in-out 1.1s infinite alternate;
  }
  @keyframes endMessageGlow {
    from {
      box-shadow:
        0 0 24px rgba(214, 168, 101, 0.14),
        0 8px 30px rgba(0, 0, 0, 0.24);
    }
    to {
      box-shadow:
        0 0 38px rgba(214, 168, 101, 0.3),
        0 8px 30px rgba(0, 0, 0, 0.24);
    }
  }
  #brand {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 600;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
  }
  #brand small {
    display: block;
    font: 500 11px/1.4 var(--body);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #iconMusic {
    pointer-events: auto;
    width: 44px;
    padding: 0;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    font-size: 18px;
  }
  #iconMusic[aria-pressed="false"] {
    color: var(--muted);
    text-decoration: line-through;
  }
  #hint {
    position: fixed;
    left: 50%;
    top: calc(70px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 32px);
    text-align: center;
    font-size: 13px;
    line-height: 1.4;
    color: var(--ivory);
    background: var(--glass);
    padding: 10px 14px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #hint.fade {
    opacity: 0;
  }
  #bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  #bar .player {
    pointer-events: auto;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 5px 14px;
    width: min(420px, 100%);
    padding: 10px 16px 9px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
  }
  #tourSeek {
    grid-column: 1 / -1;
    width: 100%;
    height: 14px;
    margin: 0;
    accent-color: var(--brass);
    cursor: pointer;
    touch-action: pan-y;
  }
  #tourControls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #tourControls button {
    width: 38px;
    min-height: 38px;
    padding: 0;
    border: 1px solid var(--line);
    background: rgba(246, 240, 230, 0.07);
    font-size: 16px;
  }
  #tourControls #tourPlay {
    width: 42px;
    min-height: 42px;
    color: var(--night);
    background: var(--ivory);
    border-color: transparent;
    font-size: 17px;
  }
  #tourControls button:disabled {
    opacity: 0.38;
    cursor: default;
  }
  #tourPosition {
    min-width: 78px;
    text-align: right;
    color: var(--muted);
    font: 500 11px/1.3 var(--body);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
  }
  button:hover,
  label.btn:hover {
    background: rgba(246, 240, 230, 0.08);
  }
  #tourControls #tourPlay:hover {
    background: var(--ivory);
  }
  #stick {
    position: fixed;
    left: max(24px, env(safe-area-inset-left, 0px));
    bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(20, 17, 24, 0.35);
    display: none;
    touch-action: none;
  }
  #stick i {
    position: absolute;
    left: 38px;
    top: 38px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(246, 240, 230, 0.75);
  }
  @media (pointer: coarse) {
    body.walk #stick {
      display: block;
    }
  }
  #fade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
  }
  #fade.on {
    opacity: 1;
  }
  #loader {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(
      ellipse at 50% 40%,
      #2e2433 0%,
      var(--night) 70%
    );
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: opacity 0.9s ease;
  }
  #loader.gone {
    opacity: 0;
    pointer-events: none;
  }
  #loader .wrap {
    text-align: center;
    max-width: 440px;
    display: grid;
    gap: 14px;
    justify-items: center;
  }
  #loader .eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brass);
  }
  #loader h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(46px, 10vw, 78px);
    line-height: 0.95;
    margin: 0;
  }
  #startTitle {
    display: grid;
    gap: 7px;
    justify-items: center;
    margin: -2px 0 2px;
    opacity: 0;
    transform: translateY(12px);
  }
  #loader.ready #startTitle {
    animation: titleReveal 1.5s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  #startTitle .title-kicker {
    color: var(--brass);
    font: 500 9px/1 var(--body);
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }
  #startTitle .title-name {
    color: var(--ivory);
    font: italic 500 clamp(23px, 5.6vw, 34px)/1.05 var(--display);
    letter-spacing: 0.045em;
    text-shadow: 0 0 24px rgba(214, 168, 101, 0.2);
  }
  @keyframes titleReveal {
    0% {
      opacity: 0;
      transform: translateY(12px);
      filter: blur(5px);
      letter-spacing: 0.12em;
    }
    65% {
      opacity: 1;
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
      letter-spacing: 0;
    }
  }
  #loader p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }
  #enter {
    background: var(--ivory);
    color: var(--night);
    padding: 0 30px;
    min-height: 54px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 10px;
  }
  #enter:hover {
    background: #fff;
  }
  #enter[disabled] {
    opacity: 0.5;
    cursor: wait;
  }
  .rule {
    width: 56px;
    height: 1px;
    background: var(--brass);
  }
  @media (max-width: 420px) {
    #brand {
      font-size: 19px;
    }
    #brand small {
      font-size: 10px;
    }
    #bar {
      padding-left: 12px;
      padding-right: 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    }
    #bar .player {
      gap: 4px 10px;
      padding: 8px 13px 7px;
    }
  }
  @media (max-height: 440px) {
    #bar {
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    }
    #stick {
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      width: 100px;
      height: 100px;
    }
    #stick i {
      left: 28px;
      top: 28px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #fade,
    #loader,
    #hint,
    #endMessage {
      transition: none;
    }
    #loader.ready #startTitle {
      animation: none;
      opacity: 1;
      transform: none;
      filter: none;
    }
    #endMessage span {
      animation: none;
    }
  }
</style>

<canvas id="gl" aria-label="3D home with photos"></canvas>
<div id="top" hidden>
  <div id="brand">Our Home<small id="brandFor">A home full of us</small></div>

</div>

<div id="bar" hidden>

        Ⅱ
      </button>
      <button id="tourNext" aria-label="Next stop" title="Next stop">▶|</button>
    </div>
    <output id="tourPosition" aria-live="polite">01 / 01</output>
  </div>
</div>
<div id="endMessage" aria-live="polite">
  <span>Love you Bhawana, chuppi 💋</span>
  <span>My Muti ki tukri lal♥️</span>
  <span>My Babe</span>
</div>
<div id="stick"><i></i></div>
<div id="fade"></div>
<div id="loader">
  <div class="wrap">

    <h1>Our Home</h1>
    <div class="rule"></div>
    <div id="startTitle" aria-label="Bhawana's Future House">

    <button id="enter" disabled>Hanging the photos…</button>
  </div>
</div>

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (f) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(f, 0, 1));
  const rnd = (seed) => () => {

  let videoEl = null;
  function setVideo(v) {
    videoEl = v;

    const t = new THREE.VideoTexture(v);

    home.screen.mat.map = t;

  function drawCover(ctx, img, cw, ch, scale, alpha) {
    const iw = img.width,
      ih = img.height,
      k = Math.max(cw / iw, ch / ih) * scale;
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, (cw - iw * k) / 2, (ch - ih * k) / 2, iw * k, ih * k);
    ctx.globalAlpha = 1;
  }
  function drawScreen(t) {
    if (!home || videoEl) return;
    const { ctx, tex } = home.screen,
      imgs = home.items.map((i) => i.source),
      P = 4.2;
    const n = Math.floor(t / P),
      f = (t % P) / P,
      a = imgs[n % imgs.length],
      b = imgs[(n + 1) % imgs.length];
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, 1280, 720);
    drawCover(ctx, a, 1280, 720, 1.04 + f * 0.1, 1);
    if (f > 0.8) drawCover(ctx, b, 1280, 720, 1.04, (f - 0.8) / 0.2);
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.font = "500 22px Figtree, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("OUR FILM · SAMPLE", 40, 680);
    tex.needsUpdate = true;
  }

  function pose(P, st, isHim, t) {
    const u = P.userData,
      w = st.walk,
      s = st.sit,
      sp = Math.sin(st.ph),
      cp = Math.cos(st.ph),
      hold = (1 - st.hug) * (1 - s);
    u.hips.position.y = lerp(0.92 - Math.abs(cp) * 0.02 * w, 0.52, s);
    u.legs.forEach((L, i) => {
      const sg = i ? -1 : 1;
      L.th.rotation.x = lerp(-sp * sg * 0.5 * w, -1.5, s);
      L.kn.rotation.x = lerp((0.08 + 0.6 * Math.max(0, cp * sg)) * w, 1.5, s);
    });
    if (u.skirt) u.skirt.rotation.x = -1.0 * s;
    u.arms.forEach((A, i) => {
      const sg = i ? -1 : 1,
        inner = isHim ? i === 0 : i === 1;
      let ax = sp * sg * 0.4 * w * (inner ? 1 - 0.75 * hold : 1),
        az = sg * 0.07,
        fx = -0.15 - 0.25 * w;
      if (inner) az += sg * 0.16 * hold;
      if (isHim && i === 1) {
        ax = lerp(ax, -1.45, st.point);
        az = lerp(az, -0.1, st.point);
        fx = lerp(fx, -0.05, st.point);
      }
      ax = lerp(ax, -0.4, s);
      fx = lerp(fx, -0.95, s);
      az = lerp(az, sg * 0.05, s);

  function resetCouple() {

  function imageUrls(src) {

      const url = new URL(src, location.href);

          ];

      if (url.hostname === "res.cloudinary.com") {
        const marker = "/image/upload/";
        const uploadAt = url.pathname.indexOf(marker);
        if (uploadAt >= 0) {
          const start = uploadAt + marker.length;
          const tail = url.pathname.slice(start);
          const transform = "q_auto:good,w_1600,c_limit";
          url.pathname =
            url.pathname.slice(0, start) +
            (tail.startsWith("f_jpg/")
              ? `f_jpg,${transform}/${tail.slice("f_jpg/".length)}`
              : `f_auto,${transform}/${tail}`);
          return [url.href];
        }
      }
    } catch (e) {}
    return [src];
  }
  function loadImg(src) {
    return new Promise((res) => {
      const urls = imageUrls(src);
      const tryLoad = (index) => {
        if (index >= urls.length) {
          res(null);
          return;
        }
        const im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = () => res(im);
        im.onerror = () => tryLoad(index + 1);
        im.src = urls[index];
      };
      tryLoad(0);
    });
  }
  function videoUrl(src) {
    return src.includes("res.cloudinary.com") && src.includes("/video/upload/")
      ? src.replace(
          "/video/upload/",
          "/video/upload/f_mp4,q_auto:eco,w_1280,c_limit/",
        )
      : src;
  }
  function toItem(source, meta) {
    const t = new THREE.Texture(source);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = MAXANI;
    t.needsUpdate = true;
    return {
      source,
      tex: t,
      aspect: source.width / source.height,
      caption: meta.caption,
      date: meta.date,
    };
  }
  /* ---------------- music: an original piano piece, generated live (no licence needed) ---------------- */
  const Music = {
    ctx: null,
    out: null,
    on: true,
    timer: null,
    step: 0,
    next: 0,
    file: null,
    resumeContext() {
      if (this.ctx)
        this.ctx.resume().catch((error) => {
          console.warn("Unable to resume music:", error);
        });
    },
    start() {
      if (this.file) {
        this.file.play().catch(() => {});
        return;
      }
      if (CONFIG.musicUrl && !this.file) {
        this.useFile(CONFIG.musicUrl);
        return;
      }
      if (this.ctx) {
        this.resumeContext();
        return;
      }
      const ctx = (this.ctx = new (
        window.AudioContext || window.webkitAudioContext
      )());
      this.resumeContext();
      const master = ctx.createGain();
      master.gain.setValueAtTime(0, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.7, ctx.currentTime + 3);
      master.connect(ctx.destination);
      const len = ctx.sampleRate * 3.2,
        ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < len; i++)
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
      }
      const rev = ctx.createConvolver();
      rev.buffer = ir;
      const wet = ctx.createGain();
      wet.gain.value = 0.55;
      rev.connect(wet);
      wet.connect(master);
      const dry = ctx.createGain();
      dry.gain.value = 0.75;
      dry.connect(master);
      const tone = ctx.createBiquadFilter();
      tone.type = "lowpass";
      tone.frequency.value = 3200;
      tone.connect(dry);
      tone.connect(rev);
      this.out = tone;
      this.master = master;
      this.next = ctx.currentTime + 0.2;
      this.step = 0;
      this.timer = setInterval(() => this.schedule(), 90);
    },
    useFile(src) {
      this.stopSynth();
      if (this.file) this.file.pause();
      const a = new Audio(src);
      a.loop = true;
      a.volume = 0.7;
      this.file = a;
      if (this.on) a.play().catch(() => {});
    },
    stopSynth() {
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      if (this.ctx) {
        this.ctx.close();
        this.ctx = null;
      }
    },
    toggle() {
      this.on = !this.on;
      if (this.file) {
        this.on ? this.file.play().catch(() => {}) : this.file.pause();
      } else if (this.ctx) {
        this.on ? this.resumeContext() : this.ctx.suspend();
      } else if (this.on) this.start();
      $("iconMusic").setAttribute("aria-pressed", this.on);
      $("iconMusic").setAttribute(
        "aria-label",
        this.on ? "Music on" : "Music off",
      );
    },
    note(t, midi, vel, len) {
      const ctx = this.ctx,
        f = 440 * Math.pow(2, (midi - 69) / 12),
        g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vel, t + 0.008);
      g.gain.setTargetAtTime(0, t + 0.01, len * 0.35);
      g.connect(this.out);
      [
        [1, 1],
        [2, 0.42],
        [3, 0.18],
        [4, 0.09],
        [5.02, 0.04],
      ].forEach(([h, a], k) => {
        const o = ctx.createOscillator(),
          og = ctx.createGain();
        o.type = "sine";
        o.frequency.value = f * h;
        o.detune.value = (Math.random() - 0.5) * 4;
        og.gain.setValueAtTime(a, t);
        og.gain.setTargetAtTime(0, t, (len * 0.5) / (k + 1));
        o.connect(og);
        og.connect(g);
        o.start(t);
        o.stop(t + len * 2.2 + 0.5);
      });
    },
    pad(t, notes, dur) {
      const ctx = this.ctx,
        g = ctx.createGain(),
        lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 900;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.022, t + 1.6);
      g.gain.setValueAtTime(0.022, t + dur - 1.2);
      g.gain.linearRampToValueAtTime(0, t + dur + 0.4);
      lp.connect(g);
      g.connect(this.out);
      notes.forEach((m) =>
        [-6, 6].forEach((dt) => {
          const o = ctx.createOscillator();
          o.type = "triangle";
          o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
          o.detune.value = dt;
          o.connect(lp);
          o.start(t);
          o.stop(t + dur + 0.6);
        }),
      );
    },
    // F major: Fmaj7 – Dm7 – Bbmaj7 – C, two bars each, 70 bpm
    SONG: [
      {
        bass: 41,
        pad: [53, 57, 64],
        arp: [53, 60, 64, 69, 72, 69, 64, 60],
        mel: [
          [72, 1.5],
          [74, 0.5],
          [76, 2],
          [77, 1],
          [76, 1],
          [72, 2],
        ],
      },
      {
        bass: 38,
        pad: [50, 57, 60],
        arp: [50, 57, 60, 65, 69, 65, 60, 57],
        mel: [
          [74, 1.5],
          [72, 0.5],
          [69, 2],
          [72, 1],
          [74, 1],
          [77, 2],
        ],
      },
      {
        bass: 34,
        pad: [46, 53, 57],
        arp: [58, 62, 65, 69, 74, 69, 65, 62],
        mel: [
          [77, 1.5],
          [76, 0.5],
          [74, 2],
          [72, 1],
          [74, 1],
          [69, 2],
        ],
      },
      {
        bass: 36,
        pad: [48, 55, 64],
        arp: [55, 60, 64, 67, 72, 67, 64, 60],
        mel: [
          [67, 1],
          [72, 1],
          [76, 2],
          [74, 2],
          [72, 2],
        ],
      },
    ],
    schedule() {
      if (!this.ctx || this.ctx.state !== "running") return;
      const beat = 60 / 70,
        e = beat / 2;
      while (this.next < this.ctx.currentTime + 0.6) {
        const t = this.next,
          s = this.step,
          chordIdx = Math.floor(s / 16) % 4,
          cyc = Math.floor(s / 64) % 3,
          ch = this.SONG[chordIdx],
          inBar = s % 16;
        const hum = () => (Math.random() - 0.5) * 0.012;
        if (inBar === 0) {
          this.note(t, ch.bass, 0.32, 5);
          this.note(t + 0.01, ch.bass + 12, 0.14, 4);
          this.pad(t, ch.pad, 16 * e);
        }
        if (inBar === 8) this.note(t + hum(), ch.bass + 7, 0.18, 3);
        this.note(
          t + hum(),
          ch.arp[s % 8],
          (cyc === 0 ? 0.1 : 0.075) + Math.random() * 0.03,
          1.6,
        );
        if (cyc > 0) {
          let acc = 0;
          for (const [m, d] of ch.mel) {
            if (Math.abs(acc * 2 - inBar) < 0.01)
              this.note(t + hum(), m, 0.26, d * beat * 1.4);
            acc += d;
          }
        }
        this.next += e;
        this.step++;
      }
    },
  };
  $("iconMusic").onclick = () => Music.toggle();
  document.addEventListener("visibilitychange", () => {
    const hidden = document.hidden;
    if (Music.ctx)
      hidden ? Music.ctx.suspend() : Music.on && Music.resumeContext();
    if (Music.file)
      hidden
        ? Music.file.pause()
        : Music.on && Music.file.play().catch(() => {});
    if (videoEl) hidden ? videoEl.pause() : videoEl.play().catch(() => {});
    if (!hidden && started) keepAwake();
  });
  let wake = null;
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator)
        wake = await navigator.wakeLock.request("screen");
    } catch (e) {}
  }
  /* ---------------- loop + boot ---------------- */
  const clock = new THREE.Clock();
  let filmT = 0,
    started = false;
  function frame() {
    const dt = Math.min(0.05, clock.getDelta());
    filmT += dt;
    drawScreen(filmT);
    if (home && started && tourPlaying && mode === "tour") updateCouple(dt);
    else if (home) updateCouple(0);
    syncTourControls();
    if (home) {
      if (mode === "tour") tourCam(started ? dt : 1);
      else walkCam(dt);
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  (async function boot() {
    $("ldFor").textContent = "Made for " + CONFIG.recipient;
    $("brandFor").textContent = "Made for " + CONFIG.recipient;
    const photoConfig = CONFIG.photos.slice(0, 45);
    const items = photoConfig.map((p, i) =>
      toItem(p.src ? loadingPhoto(i) : samplePhoto(i), p),
    );
    if (CONFIG.videoUrl) {
      const v = document.createElement("video");
      v.crossOrigin = "anonymous";
      v.preload = "none";
      v.loop = true;
      v.muted = true;
      v.playsInline = true;
      v.src = videoUrl(CONFIG.videoUrl);
      videoEl = v;
    }
    buildHome(items);
    requestAnimationFrame(frame);
    const b = $("enter");
    b.disabled = false;
    b.textContent = "Come inside";
    $("loader").classList.add("ready");
    b.onclick = () => {
      if (videoEl) videoEl.play().catch(() => {});
      if (Music.on) Music.start();
      keepAwake();
      $("loader").classList.add("gone");
      $("top").hidden = false;
      $("bar").hidden = false;
      resetCouple();
      started = true;
    };
    const installPhoto = (source, i) => {
      const item = home.items[i];
      item.source = source;
      item.aspect = source.width / source.height;
      const frame = home.photos.find((photo) => photo.item === item)?.mesh;
      if (frame) {
        const frameAspect =
          frame.geometry.parameters.width / frame.geometry.parameters.height;
        item.tex.repeat.set(
          Math.min(1, frameAspect / item.aspect),
          Math.min(1, item.aspect / frameAspect),
        );
        item.tex.offset.set(
          (1 - item.tex.repeat.x) / 2,
          (1 - item.tex.repeat.y) / 2,
        );
      }
      item.tex.image = source;
      item.tex.needsUpdate = true;
    };
    const batchSize = 4;
    for (let start = 0; start < photoConfig.length; start += batchSize) {
      const batch = photoConfig.slice(start, start + batchSize);
      const loaded = await Promise.all(
        batch.map(async (p, offset) => {
          const i = start + offset;
          if (!p.src) return null;
          return { i, source: (await loadImg(p.src)) || samplePhoto(i) };
        }),
      );
      loaded.forEach((photo) => {
        if (photo) installPhoto(photo.source, photo.i);
      });
      if (start + batchSize < photoConfig.length)
        await new Promise((resolve) => requestAnimationFrame(resolve));
    }
  })();
</script>
